name: Publish VPS images

# Explicitly started by the operator. No tests or deployments run on push.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile.production
          - service: web
            dockerfile: apps/web/Dockerfile.production
          - service: backup
            dockerfile: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            POSTGRES_MAJOR=16
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=vps-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=vps-${{ matrix.service }}
